<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMCALA · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Bricolage Grotesque',sans-serif;background:linear-gradient(145deg,#0B2559 0%,#1B5FA8 60%,#0D3880 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:400px;text-align:center;animation:fadeIn 0.6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.login-card{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);padding:36px 28px;border-radius:24px;margin-bottom:20px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;color:rgba(255,255,255,0.55)}
.field input{width:100%;padding:14px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;font-family:inherit;font-size:15px;outline:none;transition:all 0.2s;text-align:center;color:#fff}
.field input::placeholder{color:rgba(255,255,255,0.35)}
.field input:focus{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.18)}
.btn-login{width:100%;background:#fff;color:#0B2559;border:none;padding:16px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;transition:opacity 0.2s;font-family:inherit}
.btn-login:hover{opacity:0.9}
.error{color:#FFD580;font-size:13px;margin-top:12px;display:none;font-weight:600}
</style>
</head>
<body>

<div class="container">
  <div style="margin-bottom:28px">
    <img src="logo.png" alt="Logo EMCALA" style="position: relative; left: 50%; transform: translateX(-50%); width: 490px; max-width: 90vw; height: auto; margin-bottom: -5px; mix-blend-mode: screen; opacity: 0.95;">
    <div style="font-size:11px;font-weight:700;letter-spacing:0.22em;color:rgba(255,255,255,0.45);text-transform:uppercase;">Portal de Acceso</div>
  </div>

  <div id="sectionLogin" class="login-card">
    <form id="loginForm" method="post" onsubmit="doLoginHub(); return false;">
      <div class="field"><label for="user">Usuario</label><input type="text" id="user" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" placeholder="USUARIO"></div>
      <div class="field"><label for="pass">Contraseña</label><input type="password" id="pass" name="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button type="submit" class="btn-login">Ingresar</button>
    </form>
    <div id="loginErr" class="error" role="alert">Credenciales incorrectas</div>
  </div>
</div>

<!-- Auth Module -->
<script src="emcala-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ── Portal GAS (puente): convierte la sesión de Supabase en la sesión que esperan las herramientas viejas
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQ_cArrrXQ8Z1e07cpTYm62TfLkMo0vbrmWRMrWcP7XUfNeE7gqLz81aSmPQfc7tm82g/exec';

// ── Supabase Auth (login real)
const SUPABASE_URL = 'https://tdwdqgtnyqnsigzhhxsl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkd2RxZ3RueXFuc2lnemhoeHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwOTE3NDcsImV4cCI6MjA5ODY2Nzc0N30.aiYnQ3g1HIk1e4G89sODitBqtPlzva_akCz5ruvLw-8';
const DOMINIO_INTERNO = 'surcala.com.ar';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Nombres viejos que algunos usuarios todavía escriben -> usuario actual en Supabase
const ALIAS_LOGIN = { ECEIZA: 'SDVKT47', RIERASALA: 'SDVKT27' };

function mostrarError(msg) {
  const el = document.getElementById('loginErr');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLoginHub() {
  const tipeado = document.getElementById('user').value.trim().toUpperCase();
  const p = document.getElementById('pass').value.trim();
  const btn = document.querySelector('.btn-login');
  const u = ALIAS_LOGIN[tipeado] || tipeado;

  if (!u || !p) { mostrarError('Ingresa usuario y contraseña'); return; }

  btn.textContent = 'Verificando...';
  btn.disabled = true;
  document.getElementById('loginErr').style.display = 'none';

  // 1) Login contra Supabase
  const { data: sb, error: sbErr } = await supabaseClient.auth.signInWithPassword({
    email: u.toLowerCase() + '@' + DOMINIO_INTERNO,
    password: p
  });
  if (sbErr) {
    const sinRed = /fetch|network/i.test(sbErr.message || '');
    mostrarError(sinRed ? 'Error de conexión' : 'Usuario o contraseña incorrectos');
    btn.textContent = 'Ingresar'; btn.disabled = false;
    return;
  }

  // 2) Puente: pedimos al GAS la sesión legacy (rol, token, promotores) a partir del token de Supabase
  let retries = 3;
  let handled = false;

  while (retries > 0) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s: cubre cold start del GAS

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login_supabase', accessToken: sb.session.access_token }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      // Apps Script a veces devuelve HTML de error en vez de JSON.
      const text = await response.text();
      if (!text || text.trim().startsWith('<')) {
        throw new Error('Respuesta no-JSON del servidor');
      }
      const data = JSON.parse(text);

      if (data.ok) {
        EmcalaAuth.createSession({
          usuario: data.usuario || u,
          userHash: data.userHash,
          sessionToken: data.sessionToken,
          rol: data.rol,
          nombre: data.label,
          promotores: data.promotores,
          accessToken: sb.session.access_token
        });
        window.location.href = './portal/index.html';
        handled = true;
        break;
      } else {
        await supabaseClient.auth.signOut();
        mostrarError(data.error || 'No se pudo iniciar sesión');
        btn.textContent = 'Ingresar'; btn.disabled = false;
        handled = true; // error de negocio: no reintentar
        break;
      }
    } catch (error) {
      clearTimeout(timeoutId);
      console.error('[LOGIN] intento fallido:', error.name, error.message);
      retries--;
      if (retries > 0) {
        btn.textContent = 'Reintentando...';
        await new Promise(r => setTimeout(r, 1500));
      }
    }
  }

  if (!handled && retries === 0) {
    await supabaseClient.auth.signOut();
    mostrarError('Error de conexión');
    btn.textContent = 'Ingresar'; btn.disabled = false;
  }
}

// Si entra a esta página pero ya está logueado de antes, lo mandamos directo al portal
window.onload = () => {
  if (EmcalaAuth.getSession()) {
    window.location.href = './portal/index.html';
  }
};
</script>
</body>
</html>
