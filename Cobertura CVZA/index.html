<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMCALA · Cobertura CVZA</title>
  <meta name="description" content="Seguimiento de cobertura de cerveza por promotor - EMCALA">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="../emcala-auth.js"></script>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="brand">
      <strong>EMCALA</strong>
      <div class="sep"></div>
      <span>Cobertura CVZA</span>
    </div>
    <select id="monthSelect"></select>
  </div>

  <!-- BADGES AL MEDIO -->
  <div class="hdr-center">
    <div class="status-item">
      <span class="status-dot pending" id="statusMaestro"></span>
      <span id="statusMaestroText">MAESTRO</span>
    </div>
    <div class="status-item">
      <span class="status-dot pending" id="statusMesas"></span>
      <span id="statusMesasText">MESAS</span>
    </div>
    <div class="status-item">
      <span class="status-dot pending" id="statusVentas"></span>
      <span id="statusVentasText">AVANCE</span>
    </div>
    <div class="status-item">
      <span class="status-dot pending" id="statusHistoricos"></span>
      <span id="statusHistoricosText">HISTÓRICOS</span>
    </div>
  </div>

  <div class="hdr-left">
    <button class="btn btn-green" id="btnRefresh"><i class="fa-solid fa-rotate"></i> Actualizar Datos</button>
    <button class="btn btn-outline" id="btn-copy-img" style="margin-left: 8px;"><i class="fa-solid fa-camera"></i> Copiar Foto</button>

    <!-- Navegación -->
    <div id="userBadgeContainer"></div>
  </div>
</div>

<div class="tabs-container">
  <div class="tab-group" id="tabs-segmentos">
    <button class="tab-btn active" data-type="total" data-key="total">Todos</button>
    <button class="tab-btn" data-type="segmento" data-key="corevalue">Core+Value</button>
    <button class="tab-btn" data-type="segmento" data-key="abovecore">Above Core</button>
    <button class="tab-btn" data-type="segmento" data-key="balanced">Balanced Choices</button>
  </div>
  <div class="tab-group" id="tabs-marcas">
    <button class="tab-btn" data-type="marca" data-key="q1890">Quilmes 1890</button>
    <button class="tab-btn" data-type="marca" data-key="brahma">Brahma</button>
    <button class="tab-btn" data-type="marca" data-key="bud">Budweiser</button>
    <button class="tab-btn" data-type="marca" data-key="quilmes">Quilmes</button>
    <button class="tab-btn" data-type="marca" data-key="andes">Andes</button>
    <button class="tab-btn" data-type="marca" data-key="michelob">Michelob</button>
    <button class="tab-btn" data-type="marca" data-key="stella">Stella Artois</button>
    <button class="tab-btn" data-type="marca" data-key="corona">Corona</button>
    <button class="tab-btn" data-type="marca" data-key="patagonia">Patagonia</button>
    <button class="tab-btn" data-type="marca" data-key="cero">Cervezas 0.0</button>
    <button class="tab-btn" data-type="marca" data-key="stellapg">Stella Pure Gold</button>
  </div>
</div>

<div class="dias-info" id="diasInfo" style="display:none"></div>

<div class="container">
  <div id="emptyState" class="empty-state">
    Sincronizando datos de <strong>Cobertura CVZA</strong>...<br>Las Mesas, la Cartera y el Avance (CCC) se cargan automáticamente desde la nube.
  </div>
  <div class="table-wrap" id="tableWrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>PROMOTOR</th>
          <th>Cartera de<br>Clientes</th>
          <th>CCC</th>
          <th>CNC</th>
          <th>AVANCE</th>
          <th>CCC<br>MA</th>
          <th>CCC<br>MM AA</th>
          <th class="col-nuevos">Clientes<br>Nuevos</th>
          <th>Media<br>Necesaria</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div style="text-align:center">
    <div class="loading-spinner"></div>
    <div style="margin-top:14px;font-weight:600;font-size:13px;color:#fff" id="loadingText">Procesando...</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
  if (typeof EmcalaAuth !== 'undefined') {
    EmcalaAuth.renderUserBadge('userBadgeContainer');
  }
</script>
</body>
</html>
