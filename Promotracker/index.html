<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa en Vivo · Supervisión EMCALA</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800;900&display=swap');

    :root {
      --bg: #0f172a;
      --surf: #1e293b;
      --brd: #334155;
      --acc: #1B5FA8;
      --txt: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --shad: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100vh; height: 100dvh; }
    body { background: var(--bg); color: var(--txt); font-family: 'Bricolage Grotesque', sans-serif; overflow: hidden; }

    .hdr { background: rgba(30,41,59,0.9); border-bottom: 1px solid var(--brd); padding: 12px 20px; display:flex; justify-content:space-between; align-items:center; z-index: 1000; position: relative; }
    .hdr h1 { font-weight: 800; font-size: 18px; color: #fff; text-transform: uppercase; margin:0; }
    .hdr h1 span { color: var(--muted); font-weight: 600; }

    .user-badge { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
    .user-badge strong { color: #fff; }

    .btn { background: var(--acc); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn.outline { background: transparent; border: 1px solid var(--brd); color: var(--txt); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #main-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
    #app-layout { display: flex; flex: 1; min-height: 0; }

    #sidebar {
      width: 280px; background: var(--surf); border-right: 1px solid var(--brd);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--brd); }
    .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }

    .sidebar-section input[type="date"] {
      width: 100%; background: #0f172a; border: 1px solid var(--brd); padding: 8px; border-radius: 6px;
      color: #fff; font-family: inherit; font-size: 12px; outline: none;
    }
    .sidebar-hint { font-size: 10.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

    #lista-promotores { flex: 1; overflow-y: auto; }
    .prom-item {
      padding: 10px 16px; border-bottom: 1px solid rgba(51,65,85,0.5); cursor: pointer;
      display: flex; align-items: center; gap: 8px; font-size: 12px; transition: background 0.15s;
    }
    .prom-item:hover { background: rgba(255,255,255,0.05); }
    .prom-item.selected { background: rgba(27,95,168,0.3); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .prom-item .nombre { font-weight: 700; flex: 1; }
    .prom-item .hora { color: var(--muted); font-size: 10px; }

    #map { flex: 1; height: 100%; width: 100%; }

    .leyenda {
      position: absolute; bottom: 20px; left: 296px; z-index: 500;
      background: rgba(15,23,42,0.9); border: 1px solid var(--brd); border-radius: 10px;
      padding: 10px 14px; font-size: 11px; display: flex; gap: 14px; align-items: center;
    }
    .leyenda-item { display: flex; align-items: center; gap: 6px; }
    .leyenda-dot { width: 10px; height: 10px; border-radius: 50%; }

    .mapa-controles {
      position: absolute; bottom: 90px; right: 12px; z-index: 500;
      display: flex; flex-direction: column; gap: 10px;
    }
    .mapa-controles button {
      width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #0f172a;
      border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-size: 19px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
    }
    .mapa-controles button:hover { transform: scale(1.08); background: #f1f5f9; }
    .mapa-controles button:active { transform: scale(0.95); }

    /* Login */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--surf); border: 1px solid var(--brd); border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; box-shadow: var(--shad); }
    .login-card h1 { font-size: 20px; text-transform: uppercase; text-align: center; margin-bottom: 4px; }
    .login-card p.sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 24px; }
    .login-error { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: #fecaca; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .form-group input { width: 100%; background: #0f172a; border: 1px solid var(--brd); padding: 12px; border-radius: 8px; color: #fff; font-family: inherit; font-weight: 600; outline: none; }
    .form-group input:focus { border-color: var(--acc); }

    .leaflet-popup-content-wrapper { background: var(--surf); color: var(--txt); border-radius: 10px; }
    .leaflet-popup-tip { background: var(--surf); }
    .popup-nombre { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
    .popup-detalle { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
    .popup-btn { background: var(--acc); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-family: inherit; font-weight: 700; font-size: 11px; cursor: pointer; width: 100%; }

    #sidebar-backdrop {
      display: none; position: fixed; top: 57px; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 900;
    }

    #kpi-bar {
      display: none; gap: 10px; padding: 10px 20px; background: rgba(15,23,42,0.6);
      border-bottom: 1px solid var(--brd); flex-wrap: wrap;
    }
    .kpi-card {
      background: var(--surf); border: 1px solid var(--brd); border-radius: 10px;
      padding: 8px 16px; display: flex; align-items: baseline; gap: 8px; min-width: 140px;
    }
    .kpi-valor { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

    /* ============== RESPONSIVE (celulares) ============== */
    @media (max-width: 820px) {
      .hdr { padding: 10px 12px; flex-wrap: wrap; gap: 6px; }
      .hdr h1 { font-size: 14px; }
      .hdr h1 span { display: none; } /* ocultamos el subtítulo para ganar espacio */
      .user-badge { gap: 8px; font-size: 11px; }
      .solo-desktop { display: none; } /* ocultamos "Actualizado hh:mm" para ganar espacio */

      .btn-hamburguesa { display: inline-flex !important; }

      #sidebar {
        position: fixed; top: 57px; left: 0; bottom: 0; z-index: 950;
        transform: translateX(-100%); transition: transform 0.25s ease;
        width: 82vw; max-width: 320px; box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }
      #sidebar.abierto { transform: translateX(0); }
      #sidebar-backdrop.abierto { display: block; }

      #map { width: 100%; }
      .leyenda { left: 12px; bottom: 12px; font-size: 10px; padding: 8px 10px; gap: 10px; }
      .mapa-controles { bottom: 70px; right: 10px; gap: 8px; }
      .mapa-controles button { width: 40px; height: 40px; font-size: 17px; }

      /* Objetivos táctiles más grandes */
      .prom-item { padding: 14px 16px; font-size: 13px; }
      .btn { padding: 12px 16px; font-size: 13px; }
      .sidebar-section input[type="date"] { padding: 12px; font-size: 14px; }
      .popup-btn { padding: 10px 12px; font-size: 13px; }
      .login-card { padding: 24px; }
      .form-group input { padding: 14px; font-size: 15px; } /* evita zoom automático de iOS en inputs */
    }
  </style>
</head>
<body>

  <!-- ============== LOGIN ============== -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Supervisión EMCALA</h1>
      <p class="sub">Mapa en vivo · Ingresá con tu usuario</p>
      <div class="login-error" id="login-error"></div>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="login-user" placeholder="Ej: SDVAS" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" style="width:100%;" id="btn-login">Ingresar</button>
    </div>
  </div>

  <!-- ============== APP PRINCIPAL ============== -->
  <div id="main-screen" style="display:none;">
    <div class="hdr">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn outline btn-hamburguesa" id="btn-toggle-sidebar" style="display:none; padding:8px 10px; font-size:16px;"><i class="fa-solid fa-bars"></i></button>
        <h1>MAPA EN VIVO <span>| Supervisión EMCALA</span></h1>
      </div>
      <div class="user-badge">
        <span id="ultima-actualizacion" class="solo-desktop"></span>
        <span id="user-badge-text"></span>
        <button class="btn outline" style="padding:6px 10px; font-size:11px;" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>

    <div id="kpi-bar" style="display:none;">
      <div class="kpi-card">
        <div class="kpi-valor" id="kpi-promotores">0</div>
        <div class="kpi-label">Promotores conectados</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-valor" id="kpi-supervisores">0</div>
        <div class="kpi-label">Supervisores</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-valor" id="kpi-bdr">0</div>
        <div class="kpi-label">BDR conectado</div>
      </div>
    </div>

    <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
    <div id="app-layout">
      <div id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">Recorrido histórico</div>
          <input type="date" id="fecha-recorrido">
          <div class="sidebar-hint">Elegí la fecha y después tocá a un promotor o supervisor para ver su recorrido en el mapa.</div>
          <button class="btn outline" style="width:100%; margin-top:8px; font-size:11px;" onclick="cerrarRecorrido()">Ocultar recorrido</button>
        </div>
        <div class="sidebar-section" style="border-bottom:none; padding-bottom:6px;">
          <div class="sidebar-title" id="titulo-lista">Promotores</div>
        </div>
        <div id="lista-promotores"></div>
      </div>
      <div style="position: relative; flex: 1;">
        <div id="map"></div>
        <div class="leyenda">
          <div class="leyenda-item"><div class="leyenda-dot" style="background:#1B5FA8;"></div> Promotor</div>
          <div class="leyenda-item"><div class="leyenda-dot" style="background:#f59e0b;"></div> Supervisor</div>
        </div>
        <div class="mapa-controles">
          <button id="btn-mi-ubicacion" title="Mostrar mi ubicación"><i class="fa-solid fa-location-crosshairs"></i></button>
          <button id="btn-centrar-distri" title="Centrar en Suralnor"><i class="fa-solid fa-warehouse"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==========================================================
    // CONFIGURACIÓN
    // ==========================================================
    const SUPABASE_URL = 'https://tdwdqgtnyqnsigzhhxsl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkd2RxZ3RueXFuc2lnemhoeHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwOTE3NDcsImV4cCI6MjA5ODY2Nzc0N30.aiYnQ3g1HIk1e4G89sODitBqtPlzva_akCz5ruvLw-8';
    const DOMINIO_INTERNO = 'surcala.com.ar';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcCGsiNDNr2wjHueMbkeam4sE_kh3OZKP7at6iuscj8Tacxbimr7xxSAablc6bo2MFdQ/exec';
    const INTERVALO_REFRESCO_MS = 25000; // 25 segundos

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function usuarioToEmail(usuario) {
      return `${usuario.trim().toLowerCase()}@${DOMINIO_INTERNO}`;
    }
    function emailToUsuario(email) {
      return (email || '').split('@')[0].toUpperCase();
    }

    // ==========================================================
    // ESTADO GLOBAL
    // ==========================================================
    let perfilActual = null;
    let map = null;
    let marcadoresPromotores = {}; // nombre -> L.Marker
    let capaRecorrido = null;
    let ultimasPosiciones = [];
    let promotorSeleccionado = null;
    let intervaloRefresco = null;
    let listaPromotoresCompleta = [];

    // Suralnor - Av. Constitución 2270, Manuel Alberti, Buenos Aires
    const DISTRI_COORDS = [-34.4253947, -58.7779553];
    let marcadorUbicacion = null;
    let circuloPrecision = null;
    let marcadorDistri = null;

    // ==========================================================
    // SIDEBAR MOBILE (panel deslizable)
    // ==========================================================
    function toggleSidebar(forzarEstado) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const abrir = typeof forzarEstado === 'boolean' ? forzarEstado : !sidebar.classList.contains('abierto');
      sidebar.classList.toggle('abierto', abrir);
      backdrop.classList.toggle('abierto', abrir);
    }
    document.getElementById('btn-toggle-sidebar').addEventListener('click', () => toggleSidebar());

    function esMobile() {
      return window.matchMedia('(max-width: 820px)').matches;
    }

    // ==========================================================
    // LOGIN
    // ==========================================================
    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const loginError = document.getElementById('login-error');

    function mostrarErrorLogin(msg) {
      loginError.textContent = msg;
      loginError.style.display = 'block';
    }

    document.getElementById('btn-login').addEventListener('click', hacerLogin);
    document.getElementById('login-pass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') hacerLogin();
    });

    async function hacerLogin() {
      loginError.style.display = 'none';
      const usuario = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;

      if (!usuario || !pass) {
        mostrarErrorLogin('Completá usuario y contraseña.');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      const email = usuarioToEmail(usuario);
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });

      btn.disabled = false;
      btn.textContent = 'Ingresar';

      if (error) {
        mostrarErrorLogin('Usuario o contraseña incorrectos.');
        return;
      }

      await verificarRolYMostrarApp(data.user.id);
    }

    async function verificarRolYMostrarApp(userId) {
      const { data: perfil, error } = await supabaseClient
        .from('perfiles')
        .select('rol, nombre, activo, promotores_a_cargo')
        .eq('id', userId)
        .single();

      if (error || !perfil) {
        mostrarErrorLogin('No se encontró un perfil asociado a este usuario.');
        await supabaseClient.auth.signOut();
        return;
      }

      if (!perfil.activo) {
        mostrarErrorLogin('Esta cuenta está desactivada.');
        await supabaseClient.auth.signOut();
        return;
      }

      if (perfil.rol !== 'auditor' && perfil.rol !== 'supervisor') {
        mostrarErrorLogin('No tenés permiso para ver el mapa de supervisión.');
        await supabaseClient.auth.signOut();
        return;
      }

      perfilActual = perfil;

      const { data: sessionData } = await supabaseClient.auth.getSession();
      const email = sessionData.session.user.email;
      document.getElementById('user-badge-text').innerHTML =
        `<strong>${perfil.nombre}</strong> (${emailToUsuario(email)})`;

      document.getElementById('titulo-lista').textContent =
        perfil.rol === 'auditor' ? 'Todos los promotores' : 'Mis promotores';

      loginScreen.style.display = 'none';
      mainScreen.style.display = 'flex';

      if (perfil.rol === 'auditor') {
        document.getElementById('kpi-bar').style.display = 'flex';
      }

      const hoy = new Date();
      document.getElementById('fecha-recorrido').value =
        `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;

      inicializarMapa();

      const { data: todosLosPromotores } = await supabaseClient
        .from('promotores')
        .select('nombre, supervisor_login')
        .order('nombre');
      listaPromotoresCompleta = todosLosPromotores || [];

      actualizarPosiciones();
      intervaloRefresco = setInterval(actualizarPosiciones, INTERVALO_REFRESCO_MS);
    }

    async function cerrarSesion() {
      if (intervaloRefresco) clearInterval(intervaloRefresco);
      await supabaseClient.auth.signOut();
      location.reload();
    }

    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        await verificarRolYMostrarApp(data.session.user.id);
      }
    })();

    // ==========================================================
    // MAPA
    // ==========================================================
    function inicializarMapa() {
      map = L.map('map').setView([-34.45, -58.75], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      marcadorDistri = L.marker(DISTRI_COORDS, {
        icon: L.divIcon({
          className: '',
          html: `<div style="background:#8b5cf6; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.4);"><i class="fa-solid fa-warehouse"></i></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -15]
        })
      }).addTo(map).bindPopup('<div class="popup-nombre">Suralnor</div><div class="popup-detalle">Av. Constitución 2270</div>');

      document.getElementById('btn-mi-ubicacion').addEventListener('click', mostrarMiUbicacion);
      document.getElementById('btn-centrar-distri').addEventListener('click', centrarEnDistri);
    }

    function mostrarMiUbicacion() {
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          if (marcadorUbicacion) map.removeLayer(marcadorUbicacion);
          if (circuloPrecision) map.removeLayer(circuloPrecision);

          circuloPrecision = L.circle([latitude, longitude], {
            radius: accuracy, color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.15, weight: 1
          }).addTo(map);
          marcadorUbicacion = L.circleMarker([latitude, longitude], {
            radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1
          }).addTo(map);

          map.setView([latitude, longitude], 16);
        },
        (err) => {
          alert('No se pudo obtener tu ubicación: ' + err.message);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function centrarEnDistri() {
      map.setView(DISTRI_COORDS, 16);
      marcadorDistri.openPopup();
    }

    function crearIcono(tipo) {
      const color = tipo === 'supervisor' ? '#f59e0b' : '#1B5FA8';
      const icono = tipo === 'supervisor' ? 'fa-user-tie' : 'fa-user';
      return L.divIcon({
        className: '',
        html: `<div style="background:${color}; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.4);"><i class="fa-solid ${icono}"></i></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    // ==========================================================
    // ACTUALIZAR POSICIONES EN VIVO
    // ==========================================================
    async function actualizarPosiciones() {
      try {
        const resp = await fetch(APPS_SCRIPT_URL);
        const data = await resp.json();
        if (!data.ok) {
          console.error('Error del puente Axum:', data.error);
          return;
        }

        ultimasPosiciones = data.posiciones;
        renderizarMarcadores();
        renderizarListaLateral();
        actualizarKPIs();

        const ahora = new Date();
        document.getElementById('ultima-actualizacion').textContent =
          'Actualizado ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      } catch (err) {
        console.error('Error consultando posiciones:', err);
      }
    }

    function actualizarKPIs() {
      if (perfilActual.rol !== 'auditor') return;

      const nombresOnline = new Set(
        ultimasPosiciones.filter((p) => p.tipo === 'promotor' && p.nombre).map((p) => p.nombre)
      );

      // Promotores "regulares": los que tienen un supervisor real asignado (excluye BDR y Mayorista)
      const promotoresConSupervisor = listaPromotoresCompleta.filter((p) => p.supervisor_login);
      const conectadosConSupervisor = promotoresConSupervisor.filter((p) => nombresOnline.has(p.nombre)).length;

      // Supervisores: cantidad de logins de supervisor distintos (Mayorista/BDR no tienen login, quedan afuera solos)
      const supervisoresDistintos = new Set(promotoresConSupervisor.map((p) => p.supervisor_login));

      // BDR: en la práctica solo se monitorea a Vedia Elizabeth
      const bdrConectado = nombresOnline.has('VEDIA ELIZABETH') ? 1 : 0;

      document.getElementById('kpi-promotores').textContent = conectadosConSupervisor;
      document.getElementById('kpi-supervisores').textContent = supervisoresDistintos.size;
      document.getElementById('kpi-bdr').textContent = bdrConectado;
    }

    function itemVisible(item) {
      if (!perfilActual) return false;
      if (perfilActual.rol === 'auditor') return true;
      if (item.tipo === 'promotor') {
        return (perfilActual.promotores_a_cargo || []).includes(item.nombre);
      }
      // Para supervisores, no mostramos la posición de OTROS supervisores
      return false;
    }

    function renderizarMarcadores() {
      const visibles = ultimasPosiciones.filter(itemVisible);
      const nombresActuales = new Set();

      visibles.forEach((item) => {
        const clave = item.tipo === 'promotor' ? item.nombre : ('supervisor_' + item.usuario);
        if (!clave || (item.tipo === 'promotor' && !item.nombre)) return;
        nombresActuales.add(clave);

        const popupHtml = item.tipo === 'promotor'
          ? `<div class="popup-nombre">${item.nombre}</div>
             <div class="popup-detalle">
               Supervisor: ${item.supervisor_nombre || '-'}<br>
               Canal: ${item.canal || '-'}<br>
               Clientes visitados hoy: <strong>${item.clientesVisitadosHoy || 0}</strong><br>
               Última posición: ${item.hora || '-'}
             </div>
             <button class="popup-btn" onclick="verRecorrido('${item.nombre.replace(/'/g, "\\'")}')"><i class="fa-solid fa-route"></i> Ver recorrido</button>
             <button class="popup-btn" style="margin-top:6px; background:#10b981;" onclick="abrirEnGoogleMaps(${item.lat}, ${item.lng})"><i class="fa-solid fa-car"></i> Cómo llegar</button>`
          : `<div class="popup-nombre">Supervisor</div>
             <div class="popup-detalle">
               Usuario: ${item.usuario || '-'}<br>
               Clientes visitados hoy: <strong>${item.clientesVisitadosHoy || 0}</strong><br>
               Última posición: ${item.hora || '-'}
             </div>
             <button class="popup-btn" onclick="verRecorridoSupervisor('${item.usuario}')"><i class="fa-solid fa-route"></i> Ver recorrido</button>
             <button class="popup-btn" style="margin-top:6px; background:#10b981;" onclick="abrirEnGoogleMaps(${item.lat}, ${item.lng})"><i class="fa-solid fa-car"></i> Cómo llegar</button>`;

        if (marcadoresPromotores[clave]) {
          marcadoresPromotores[clave].setLatLng([item.lat, item.lng]);
          marcadoresPromotores[clave].setPopupContent(popupHtml);
        } else {
          const marker = L.marker([item.lat, item.lng], { icon: crearIcono(item.tipo) }).addTo(map);
          marker.bindPopup(popupHtml);
          marcadoresPromotores[clave] = marker;
        }
      });

      // Sacar del mapa a quienes ya no están en la última respuesta
      Object.keys(marcadoresPromotores).forEach((clave) => {
        if (!nombresActuales.has(clave)) {
          map.removeLayer(marcadoresPromotores[clave]);
          delete marcadoresPromotores[clave];
        }
      });
    }

    function renderizarListaLateral() {
      const cont = document.getElementById('lista-promotores');
      const visibles = ultimasPosiciones.filter((i) => itemVisible(i) && i.tipo === 'promotor' && i.nombre);

      // Si es supervisor, también mostramos en la lista a los promotores a cargo que
      // ahora mismo NO están online (para que se note que están offline)
      let nombresBase;
      if (perfilActual.rol === 'auditor') {
        nombresBase = listaPromotoresCompleta.map((p) => p.nombre);
      } else {
        nombresBase = [...(perfilActual.promotores_a_cargo || [])];
      }
      // Por las dudas, si alguien aparece online pero no estaba en la lista base, lo agregamos igual
      visibles.forEach((v) => {
        if (!nombresBase.includes(v.nombre)) nombresBase.push(v.nombre);
      });

      nombresBase.sort();

      cont.innerHTML = '';
      nombresBase.forEach((nombre) => {
        const item = visibles.find((v) => v.nombre === nombre);
        const div = document.createElement('div');
        div.className = 'prom-item' + (promotorSeleccionado === nombre ? ' selected' : '');
        div.innerHTML = `
          <div class="dot ${item ? 'online' : 'offline'}"></div>
          <div class="nombre">${nombre}</div>
          <div class="hora">${item ? item.hora : ''}</div>
        `;
        div.onclick = () => {
          if (item) {
            map.setView([item.lat, item.lng], 15);
            marcadoresPromotores[nombre].openPopup();
          }
          verRecorrido(nombre);
          if (esMobile()) toggleSidebar(false);
        };
        cont.appendChild(div);
      });
    }

    // ==========================================================
    // RECORRIDO HISTÓRICO (superpuesto en el mismo mapa en vivo)
    // ==========================================================
    // Usuario de login de supervisor -> nombre real (para consultar su recorrido)
    const SUPERVISOR_NOMBRES = {
      'SDVAS': 'ARES PEDRO',
      'SDVKT20': 'AVILA EZEQUIEL',
      'SDVKT27': 'RIERA SALA DANIELA',
      'SDVKT47': 'ECEIZA KEVIN'
    };

    function abrirEnGoogleMaps(lat, lng) {
      const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
      window.open(url, '_blank');
    }

    function verRecorridoSupervisor(usuario) {
      const nombre = SUPERVISOR_NOMBRES[usuario];
      if (!nombre) return;
      verRecorrido(nombre, 'supervisor');
    }

    async function verRecorrido(nombre, tipo = 'promotor') {
      promotorSeleccionado = tipo === 'promotor' ? nombre : null;
      renderizarListaLateral();

      const fecha = document.getElementById('fecha-recorrido').value;
      if (!fecha) return;

      const inicio = `${fecha}T00:00:00-03:00`;
      const fin = `${fecha}T23:59:59-03:00`;

      const { data, error } = await supabaseClient
        .from('posiciones')
        .select('lat, lng, registrado_en')
        .eq('promotor', nombre)
        .eq('tipo', tipo)
        .gte('registrado_en', inicio)
        .lte('registrado_en', fin)
        .order('registrado_en', { ascending: true });

      if (capaRecorrido) {
        map.removeLayer(capaRecorrido);
        capaRecorrido = null;
      }

      if (error || !data || data.length === 0) return;

      const colorRecorrido = tipo === 'supervisor' ? '#f59e0b' : '#38bdf8';
      const puntos = data.map((p) => [p.lat, p.lng]);
      capaRecorrido = L.layerGroup().addTo(map);
      L.polyline(puntos, { color: colorRecorrido, weight: 4, opacity: 0.85 }).addTo(capaRecorrido);
      puntos.forEach((p) => {
        L.circleMarker(p, { radius: 4, color: colorRecorrido, fillOpacity: 1 }).addTo(capaRecorrido);
      });
      L.circleMarker(puntos[0], { radius: 7, color: '#10b981', weight: 2, fillOpacity: 1 })
        .bindTooltip('Inicio').addTo(capaRecorrido);
      L.circleMarker(puntos[puntos.length - 1], { radius: 7, color: '#ef4444', weight: 2, fillOpacity: 1 })
        .bindTooltip('Última posición').addTo(capaRecorrido);

      map.fitBounds(puntos, { padding: [40, 40] });
    }

    function cerrarRecorrido() {
      if (capaRecorrido) {
        map.removeLayer(capaRecorrido);
        capaRecorrido = null;
      }
      promotorSeleccionado = null;
      renderizarListaLateral();
    }

    document.getElementById('fecha-recorrido').addEventListener('change', () => {
      if (promotorSeleccionado) {
        verRecorrido(promotorSeleccionado);
      } else {
        alert('Ahora tocá a un promotor o supervisor (en la lista o en el mapa) para ver su recorrido de ese día.');
      }
    });
  </script>
</body>
