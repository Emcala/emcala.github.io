<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Cuentas · Supervisión EMCALA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800;900&display=swap');

    :root {
      --bg: #0f172a;
      --surf: #1e293b;
      --brd: #334155;
      --acc: #1B5FA8;
      --txt: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --shad: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: var(--bg); color: var(--txt); font-family: 'Bricolage Grotesque', sans-serif; min-height: 100vh; padding-bottom: 40px; }

    .hdr { background: rgba(30,41,59,0.5); border-bottom: 1px solid var(--brd); padding: 20px; display:flex; justify-content:space-between; align-items:center; }
    .hdr h1 { font-weight: 800; font-size: 20px; color: #fff; text-transform: uppercase; margin:0; }
    .hdr h1 span { color: var(--muted); font-weight: 600; }

    .container { padding: 24px; max-width: 1000px; margin: 0 auto; }

    .card { background: var(--surf); border-radius: 12px; padding: 24px; box-shadow: var(--shad); border: 1px solid var(--brd); margin-bottom: 24px; }

    .btn { background: var(--acc); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn.danger { background: var(--red); }
    .btn.success { background: var(--green); }
    .btn.outline { background: transparent; border: 1px solid var(--brd); color: var(--txt); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px; border-bottom: 2px solid var(--brd); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    td { padding: 16px 12px; border-bottom: 1px solid var(--brd); font-size: 14px; font-weight: 600; }

    .badge { padding: 4px 8px; border-radius: 100px; font-size: 11px; font-weight: 800; background: #334155; color: #fff; text-transform: uppercase; }
    .badge.inactivo { background: var(--red); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal { background: var(--surf); padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid var(--brd); }
    .modal h2 { margin-bottom: 20px; font-size: 18px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .form-group input, .form-group select { width: 100%; background: #0f172a; border: 1px solid var(--brd); padding: 12px; border-radius: 8px; color: #fff; font-family: inherit; font-weight: 600; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--acc); }
    .form-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

    #loading { text-align: center; color: var(--muted); padding: 40px; font-weight: 600; }

    .nav-link { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .nav-link:hover { color: #fff; }

    .user-badge { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .user-badge strong { color: #fff; }
  </style>
</head>
<body>

  <!-- ============== PANTALLA PRINCIPAL (solo auditor) ============== -->
  <div id="main-screen" style="display:none;">
    <div class="hdr">
      <div style="display: flex; align-items: center; gap: 16px;">
        <h1>SUPERVISIÓN <span>| Gestión de Cuentas</span></h1>
      </div>
      <div class="user-badge">
        <span id="user-badge-text"></span>
        <button class="btn outline" style="padding:6px 10px; font-size:11px;" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <div class="flex-between">
          <h2 style="font-size: 18px;">Usuarios del Sistema</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn outline" onclick="importarUsuariosPortal()">Importar usuarios del Portal</button><button class="btn" onclick="abrirModal()">+ Nueva Cuenta</button></div>
        </div>

        <div id="loading">Cargando usuarios...</div>
        <table id="users-table" style="display:none;">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Nombre</th>
              <th>Rol</th>
              <th>Promotores</th>
              <th>Estado</th>
              <th style="text-align: right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-users"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ============== MODAL ALTA/EDICIÓN ============== -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Nueva Cuenta</h2>
      <input type="hidden" id="is-edit" value="false">
      <input type="hidden" id="target-id" value="">

      <div class="form-group">
        <label>Usuario (Login)</label>
        <input type="text" id="m-user" placeholder="Ej: SDVAS">
        <div class="form-hint" id="m-user-hint"></div>
      </div>
      <div class="form-group">
        <label>Nombre real</label>
        <input type="text" id="m-nombre" placeholder="Ej: ARES PEDRO">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="text" id="m-pass" placeholder="•••••••• (dejar vacío si no querés cambiarla)">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="m-rol">
          <option value="auditor">Auditor (Máxima Autoridad)</option>
          <option value="supervisor">Supervisor</option>
          <option value="trade">Trade Marketing</option>
          <option value="tecnico">Técnico</option>
          <option value="promotor">Promotor</option>
        </select>
      </div>
      <div class="form-group">
        <label>Promotores a Cargo (Opcional)</label>
        <input type="text" id="m-promotores" placeholder="Ej: JUAN PEREZ, GOMEZ LUIS (separados por coma)">
      </div>

      <div class="modal-footer">
        <button class="btn outline" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" id="btn-save" onclick="guardarUsuario()">Guardar Cuenta</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../emcala-auth.js"></script>
  <script>
    // Helper de escape HTML
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ==========================================================
    // CONFIGURACIÓN
    // ==========================================================
    const SUPABASE_URL = 'https://tdwdqgtnyqnsigzhhxsl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkd2RxZ3RueXFuc2lnemhoeHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwOTE3NDcsImV4cCI6MjA5ODY2Nzc0N30.aiYnQ3g1HIk1e4G89sODitBqtPlzva_akCz5ruvLw-8';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function emailToUsuario(email) {
      return (email || '').split('@')[0].toUpperCase();
    }

    // ==========================================================
    // LOGIN / SESIÓN COMPARTIDA CON EL PORTAL (solo auditor)
    // ==========================================================
    const mainScreen = document.getElementById('main-screen');
    let cerrando = false;

    async function verificarRolYMostrarApp(userId) {
      const { data: perfil, error } = await supabaseClient
        .from('perfiles')
        .select('rol, nombre, activo')
        .eq('id', userId)
        .single();

      // Sin perfil o cuenta desactivada: se cierra todo y vuelve al login del portal
      if (error || !perfil || !perfil.activo) {
        await cerrarSesion();
        return;
      }

      // Rol distinto de auditor: NO se cierra la sesión, vuelve al portal
      if (perfil.rol !== 'auditor') {
        alert('No tenés permiso para acceder a Gestión de Cuentas (solo Auditor).');
        window.location.replace(EmcalaAuth.PORTAL_URL);
        return;
      }

      // OK: es auditor, mostramos la app
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const email = sessionData.session.user.email;
      document.getElementById('user-badge-text').innerHTML =
        `<strong>${esc(perfil.nombre)}</strong> (${esc(emailToUsuario(email))})`;

      mainScreen.style.display = 'block';
      cargarUsuarios();
    }

    async function cerrarSesion() {
      if (cerrando) return;
      cerrando = true;
      try { await supabaseClient.auth.signOut({ scope: 'local' }); } catch (e) {}
      EmcalaAuth.logout(); // borra user_session y las claves sb-*, y redirige al login del portal
    }

    (async () => {
      // Misma regla que el portal y el mapa: sin sesión del portal, o vencida por 30 min de inactividad -> al login
      if (!EmcalaAuth.requireLogin()) return;
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) { window.location.replace(EmcalaAuth.LOGIN_URL); return; }
      await verificarRolYMostrarApp(data.session.user.id);
    })();

    // ==========================================================
    // LLAMADAS A LA EDGE FUNCTION admin-usuarios
    // ==========================================================
    async function llamarAdminUsuarios(payload) {
      const { data, error } = await supabaseClient.functions.invoke('admin-usuarios', {
        body: payload,
      });

      if (error) {
        alert('Error de conexión: ' + error.message);
        return null;
      }
      if (!data || !data.ok) {
        alert('Error: ' + (data?.error || 'Desconocido'));
        return null;
      }
      return data;
    }

    // ==========================================================
    // TABLA DE USUARIOS
    // ==========================================================
    async function cargarUsuarios() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = 'Cargando usuarios...';
      document.getElementById('users-table').style.display = 'none';

      const data = await llamarAdminUsuarios({ action: 'listar' });
      if (data && data.usuarios) {
        renderTabla(data.usuarios);
      } else {
        document.getElementById('loading').textContent = 'Error al cargar los usuarios.';
      }
    }

    function renderTabla(usuarios) {
      const tbody = document.getElementById('tbody-users');
      tbody.innerHTML = '';
      usuarios.forEach(u => {
        const promotores = (u.promotores_a_cargo || []).join(', ') || '-';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.usuario}</td>
          <td>${u.nombre}</td>
          <td><span class="badge">${u.rol}</span></td>
          <td>${promotores}</td>
          <td><span class="badge ${u.activo ? '' : 'inactivo'}">${u.activo ? 'ACTIVO' : 'INACTIVO'}</span></td>
          <td style="text-align:right; gap:8px; display:flex; justify-content:flex-end;">
            <button class="btn outline" style="padding:4px 8px;"
              onclick='abrirModalEdicion(${JSON.stringify(u).replace(/'/g, "&#39;")})'>Editar</button>
            <button class="btn ${u.activo ? 'danger' : 'success'}" style="padding:4px 8px;"
              onclick="toggleActivo('${u.id}', ${u.activo})">${u.activo ? 'Desactivar' : 'Reactivar'}</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('loading').style.display = 'none';
      document.getElementById('users-table').style.display = 'table';
    }

    // ==========================================================
    // MODAL ALTA / EDICIÓN
    // ==========================================================
    function abrirModal() {
      document.getElementById('is-edit').value = 'false';
      document.getElementById('modal-title').textContent = 'Nueva Cuenta';
      document.getElementById('m-user').value = '';
      document.getElementById('m-user').disabled = false;
      document.getElementById('m-user-hint').textContent = '';
      document.getElementById('m-nombre').value = '';
      document.getElementById('m-pass').value = '';
      document.getElementById('m-pass').placeholder = '••••••••';
      document.getElementById('m-rol').value = 'supervisor';
      document.getElementById('m-promotores').value = '';
      document.getElementById('modal').style.display = 'flex';
    }

    function abrirModalEdicion(u) {
      document.getElementById('is-edit').value = 'true';
      document.getElementById('target-id').value = u.id;
      document.getElementById('modal-title').textContent = 'Editar Cuenta: ' + u.usuario;

      document.getElementById('m-user').value = u.usuario;
      document.getElementById('m-user').disabled = true;
      document.getElementById('m-user-hint').textContent = 'El usuario de login no se puede modificar.';
      document.getElementById('m-nombre').value = u.nombre;
      document.getElementById('m-pass').value = '';
      document.getElementById('m-pass').placeholder = '•••••••• (dejar vacío si no querés cambiarla)';
      document.getElementById('m-rol').value = u.rol;
      document.getElementById('m-promotores').value = (u.promotores_a_cargo || []).join(', ');

      document.getElementById('modal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function parsearPromotores(texto) {
      return texto.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
    }

    async function guardarUsuario() {
      const isEdit = document.getElementById('is-edit').value === 'true';
      const usuario = document.getElementById('m-user').value.trim().toUpperCase();
      const nombre = document.getElementById('m-nombre').value.trim().toUpperCase();
      const pass = document.getElementById('m-pass').value.trim();
      const rol = document.getElementById('m-rol').value;
      const promotores = parsearPromotores(document.getElementById('m-promotores').value);

      if (!usuario || !nombre || (!pass && !isEdit) || !rol) {
        alert('Completá los campos obligatorios.');
        return;
      }

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      let resultado;
      if (isEdit) {
        const id = document.getElementById('target-id').value;
        const payload = { action: 'editar', id, nombre, rol, promotores };
        if (pass) payload.password = pass;
        resultado = await llamarAdminUsuarios(payload);
      } else {
        resultado = await llamarAdminUsuarios({
          action: 'crear', usuario, nombre, password: pass, rol, promotores
        });
      }

      if (resultado) {
        cerrarModal();
        cargarUsuarios();
      }

      btn.disabled = false;
      btn.textContent = 'Guardar Cuenta';
    }


    // Importación única de las cuentas del Portal que todavía no existen en Supabase
    async function importarUsuariosPortal() {
      const lista = [
        { usuario: 'JDV',     nombre: 'BUSAID PABLO',    rol: 'auditor'    },
        { usuario: 'NABS',    nombre: 'FLORES AGUSTINA', rol: 'auditor'    },
        { usuario: 'ARESW',   nombre: 'ARES WALTER',     rol: 'auditor'    },
        { usuario: 'EDV',     nombre: 'EDV',             rol: 'auditor'    },
        { usuario: 'TECNICO', nombre: 'TECNICO',         rol: 'tecnico'    },
        { usuario: 'TRADE',   nombre: 'TRADE',           rol: 'trade'      },
        { usuario: 'BDR',     nombre: 'BDR',             rol: 'supervisor' }
      ];
      const pass = prompt('Contraseña general temporal (mínimo 6 caracteres) para las ' + lista.length + ' cuentas nuevas:');
      if (!pass) return;
      if (pass.length < 6) { alert('La contraseña debe tener al menos 6 caracteres.'); return; }
      if (!confirm('Se van a crear: ' + lista.map(u => u.usuario).join(', ') + '. ¿Continuar?')) return;

      const resultados = [];
      for (const u of lista) {
        const { data, error } = await supabaseClient.functions.invoke('admin-usuarios', {
          body: { action: 'crear', usuario: u.usuario, nombre: u.nombre, password: pass, rol: u.rol, promotores: [] }
        });
        let msg = null;
        if (error) {
          try { const b = await error.context.json(); msg = b.error; } catch (e) { msg = error.message; }
        } else if (!data || !data.ok) {
          msg = (data && data.error) || 'error desconocido';
        }
        resultados.push(u.usuario + ': ' + (msg ? 'NO se creó (' + msg + ')' : 'creada'));
      }
      alert(resultados.join('\n'));
      cargarUsuarios();
    }

    async function toggleActivo(id, estaActivo) {
      const accion = estaActivo ? 'desactivar' : 'reactivar';
      if (!confirm(`¿Seguro que querés ${accion} esta cuenta?`)) return;

      const resultado = await llamarAdminUsuarios({ action: 'set_activo', id, activo: !estaActivo });
      if (resultado) cargarUsuarios();
    }
  </script>
</body>
</html>
